<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>url-encoded</title>
</head>
<body>
    <form action="http://localhost:8081/member/url-encoded" method="post" enctype="application/x-www-form-urlencoded">
        이름 : <input type="text" name="name">
        이메일 : <input type="text" name="email">
        <input type="submit" value="제출">
    </form>
</body>
</html>
<!--
form이 post 요청을 보내는 주소는 MemberController
즉 MemberController에서 post요청을 처리해줌
-->
